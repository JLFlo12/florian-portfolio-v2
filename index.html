    <!-- Polices hébergées sur le site (voir src/index.css) : les deux principales sont préchargées -->
    <link rel="preload" href="/fonts/hubot-sans.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/mona-sans.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Écran de chargement : affiché seulement si JS actif et animations autorisées -->
    <script>
      (function () {
        var r = document.documentElement;
        try { if (localStorage.getItem('theme') === 'light') r.classList.remove('dark'); } catch (e) {}
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) r.classList.add('is-loading');
        setTimeout(function () { r.classList.remove('is-loading'); }, 6000);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
